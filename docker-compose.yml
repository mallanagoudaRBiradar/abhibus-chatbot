# Local infrastructure for the journey-chat server.
#   docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: journey_chat
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d journey_chat"]
      interval: 5s
      retries: 10
  # Optional — only needed to run more than one server instance.
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    profiles: ["scale"]
volumes:
  pgdata:

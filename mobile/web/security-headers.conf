add_header Content-Security-Policy $chat_csp always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
# geolocation + microphone stay available to the chat itself: QR guests use the same build in a normal browser.
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(self), payment=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;

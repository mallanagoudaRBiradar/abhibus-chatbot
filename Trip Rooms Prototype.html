<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Trip Rooms Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: night-highway shell (dark, deliberate single theme) with surface tabs; consoles = nav + work area + live traveller phone; phone is a light tenant-themed world. */
:root{
  --night:#0a0f1e; --panel:#111a2f; --panel-2:#16213b; --line:#24314f; --line-2:#31406a;
  --text:#e8ecf6; --muted:#97a3c0; --dim:#66729a;
  --amber:#ffb547; --amber-soft:rgba(255,181,71,.14);
  --teal:#3ed6c0; --teal-soft:rgba(62,214,192,.13);
  --rose:#ff6b7d; --rose-soft:rgba(255,107,125,.15);
  --violet:#9a8cff; --violet-soft:rgba(154,140,255,.16);
  --ph-bg:#f3f4f7; --ph-card:#ffffff; --ph-text:#1a1f2e; --ph-muted:#677089; --ph-line:#e3e6ee;
  --ph-ops:#fff1f0; --ph-ops-line:#f3b6b0; --ph-warn:#fff6e5; --ph-warn-line:#f2cf8a; --ph-ai:#f0eeff; --ph-ai-line:#cfc8ff;
  --f-display:"Unbounded","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--night);color:var(--text);font:15px/1.5 var(--f-body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.bg-layer{position:fixed;inset:0;z-index:0;pointer-events:none}
.bg-base{background-image:linear-gradient(rgba(102,114,154,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(102,114,154,.07) 1px,transparent 1px);background-size:44px 44px}
.bg-reveal{--mx:50%;--my:30%;background-image:linear-gradient(rgba(255,181,71,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(62,214,192,.2) 1px,transparent 1px),radial-gradient(circle at var(--mx) var(--my),rgba(255,181,71,.10),transparent 60%);background-size:44px 44px,44px 44px,100% 100%;
  -webkit-mask-image:radial-gradient(circle 260px at var(--mx) var(--my),#000 0,#000 40%,rgba(0,0,0,.75) 60%,rgba(0,0,0,.4) 75%,rgba(0,0,0,.12) 88%,transparent 100%);
          mask-image:radial-gradient(circle 260px at var(--mx) var(--my),#000 0,#000 40%,rgba(0,0,0,.75) 60%,rgba(0,0,0,.4) 75%,rgba(0,0,0,.12) 88%,transparent 100%)}
#mesh{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.5}
.shell{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:10px 16px;background:rgba(10,15,30,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font:700 .95rem var(--f-display)}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--amber);box-shadow:0 0 12px var(--amber)}
.brand small{font:500 .62rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--amber);border:1px solid rgba(255,181,71,.4);padding:2px 6px;border-radius:5px}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;overflow-x:auto;max-width:100%}
.tabs button{border:0;background:transparent;color:var(--muted);padding:7px 12px;border-radius:9px;white-space:nowrap;font-weight:600;font-size:.86rem}
.tabs button[aria-pressed="true"]{background:var(--panel-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2)}
.clock{margin-left:auto;display:flex;align-items:center;gap:8px;font:500 .78rem var(--f-mono);color:var(--muted);flex-wrap:wrap}
.clock b{color:var(--text)}
.btn{border:1px solid var(--line-2);background:var(--panel-2);color:var(--text);border-radius:9px;padding:6px 11px;font-size:.84rem;font-weight:600}
.btn:hover{border-color:var(--amber)}
.btn.pri{background:var(--amber);border-color:var(--amber);color:#1d1406}
.btn.danger{background:var(--rose-soft);border-color:rgba(255,107,125,.5);color:var(--rose)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 8px;font-size:.76rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}

#view{flex:1;padding:16px;padding-block:18px 40px}
.fallback{max-width:640px;margin:40px auto;color:var(--muted)}

/* generic panels */
.panel{background:rgba(17,26,47,.86);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.panel h3{font:600 .72rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:0 0 10px}
.panel h3+*{margin-top:0}
.ctl{display:grid;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.ctl:first-of-type{border-top:0;padding-top:0}
.ctl label,.lbl{font-size:.78rem;color:var(--muted);font-weight:600}
.ctl small,.hint{font-size:.74rem;color:var(--dim)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:5px 9px;font-size:.78rem;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--amber-soft);color:var(--amber);border-color:rgba(255,181,71,.5)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line-2);background:var(--panel-2);font-weight:700}
.stepper b{font:600 .95rem var(--f-mono);min-width:24px;text-align:center}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.84rem}
.sw{width:38px;height:22px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel-2);position:relative;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--dim);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--teal-soft);border-color:var(--teal)}
.sw[aria-checked="true"]::after{transform:translateX(16px);background:var(--teal)}
.chip{display:inline-flex;align-items:center;gap:4px;font:600 .66rem var(--f-mono);letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:6px;white-space:nowrap}
.c-crit{background:var(--rose-soft);color:var(--rose)}
.c-warn{background:var(--amber-soft);color:var(--amber)}
.c-ok{background:var(--teal-soft);color:var(--teal)}
.c-info{background:var(--violet-soft);color:var(--violet)}
.c-mute{background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}
.c-p2{border:1px dashed var(--dim);color:var(--muted)}

/* traveller layout */
.app-layout{display:grid;grid-template-columns:minmax(0,300px) auto minmax(0,320px);gap:18px;justify-content:center;align-items:start;max-width:1320px;margin:0 auto}
.phone-col{display:grid;gap:10px;justify-items:center}
.uc{display:grid;gap:2px}
.uc-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:.84rem}
.uc-row:first-child{border-top:0}
.uc-row span.n{flex:1;min-width:0}
.ev{display:grid;gap:8px;max-height:640px;overflow:auto}
.ev-i{border-left:2px solid var(--line-2);padding:2px 0 2px 10px;font-size:.8rem}
.ev-i code{font:500 .76rem var(--f-mono);color:var(--amber)}
.ev-i small{display:block;color:var(--dim);font:.7rem var(--f-mono)}
.ev-i p{margin:2px 0 0;color:var(--muted)}
.tsw{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px}
.tsw button{border:0;background:transparent;color:var(--muted);padding:6px 10px;border-radius:8px;font-size:.8rem;font-weight:600;display:flex;align-items:center;gap:6px}
.tsw button i{width:8px;height:8px;border-radius:50%}
.tsw button[aria-pressed="true"]{background:var(--panel-2);color:var(--text)}

/* phone */
.phone{--brand:#d4373c;--brand-ink:#ffffff;--brand-soft:#fde8e8;width:370px;max-width:100%;height:740px;border-radius:38px;background:#05070d;padding:10px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px var(--line-2);position:relative}
.phone[data-tenant="train"]{--brand:#ea6a1b;--brand-soft:#fdecdf}
.phone[data-tenant="flight"]{--brand:#2b5ce6;--brand-soft:#e3eafe}
.scr{height:100%;border-radius:30px;overflow:hidden;background:var(--ph-bg);color:var(--ph-text);display:flex;flex-direction:column;position:relative;font-size:14px}
.ph-st{display:flex;justify-content:space-between;padding:8px 20px 4px;font:600 .72rem var(--f-body);background:var(--brand);color:var(--brand-ink)}
.ph-app{display:flex;align-items:center;gap:8px;padding:6px 14px 10px;background:var(--brand);color:var(--brand-ink);font-size:.82rem}
.ph-app b{font-weight:700;letter-spacing:.01em}
.ph-app small{margin-left:auto;opacity:.85}
.rh{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--ph-card);border-bottom:1px solid var(--ph-line)}
.rh-t{flex:1;min-width:0}
.rh-t b{display:block;font-size:.95rem;line-height:1.2}
.rh-t small{display:block;color:var(--ph-muted);font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sos{border:0;background:#e5333f;color:#fff;font:700 .72rem var(--f-body);letter-spacing:.06em;border-radius:8px;padding:6px 9px}
.kebab{border:0;background:transparent;font-size:1.2rem;color:var(--ph-muted);padding:2px 6px}
.pin{display:flex;gap:8px;align-items:flex-start;padding:8px 12px;font-size:.78rem;background:var(--ph-warn);border-bottom:1px solid var(--ph-warn-line)}
.pin.crit{background:var(--ph-ops);border-color:var(--ph-ops-line)}
.pin b{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.strip{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--ph-line);background:var(--ph-card);padding:8px 12px}
.strip .pd{width:10px;height:10px;border-radius:50%;background:#16a37f;box-shadow:0 0 0 4px rgba(22,163,127,.18);flex:none;animation:pulse 2s infinite}
.strip span.tx{flex:1;min-width:0}
.strip b{display:block;font-size:.82rem}
.strip small{display:block;color:var(--ph-muted);font-size:.72rem}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(22,163,127,.05)}}
.cf{font:700 .6rem var(--f-body);text-transform:uppercase;letter-spacing:.06em;padding:3px 6px;border-radius:5px;white-space:nowrap}
.cf.high{background:#dcf5ee;color:#0f7a5f}.cf.medium{background:#fdf0d5;color:#9a6200}.cf.estimated{background:#eceef4;color:#5b6378}
.qb{padding:6px 12px;font-size:.72rem;background:#eef0fb;color:#4b4f8a;border-bottom:1px solid var(--ph-line)}
.feed{flex:1;overflow-y:auto;padding:10px 10px 6px;display:flex;flex-direction:column;gap:8px;scroll-behavior:auto}
.m{max-width:84%;background:var(--ph-card);border:1px solid var(--ph-line);border-radius:14px;padding:7px 10px;font-size:.84rem;line-height:1.4;position:relative}
.m .w{display:flex;gap:6px;align-items:center;font-size:.68rem;color:var(--ph-muted);font-weight:700;margin-bottom:1px}
.m .w time{font-weight:500;margin-left:auto}
.m.me{align-self:flex-end;background:var(--brand-soft);border-color:transparent}
.m.ops{max-width:100%;background:var(--ph-warn);border-color:var(--ph-warn-line)}
.m.ops.crit{background:var(--ph-ops);border-color:var(--ph-ops-line)}
.m.ops.info{background:#eef5ff;border-color:#c7dafb}
.m.tara{background:var(--ph-ai);border-color:var(--ph-ai-line)}
.m.crew{background:#eaf7f2;border-color:#b9e3d3}
.m.priv{border-style:dashed;border-color:#b9bfd0;background:#fafbfd;max-width:100%}
.m.hid{font-style:italic;color:var(--ph-muted)}
.bd{font:700 .56rem var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:2px 5px;border-radius:4px}
.bd.ops{background:#e5333f;color:#fff}.bd.ai{background:#6b5cf0;color:#fff}.bd.ad{background:#e6e8ef;color:#5b6378}.bd.crew{background:#139a6e;color:#fff}.bd.p2{border:1px dashed #9aa1b5;color:#6b7289}
.sys{align-self:center;font-size:.7rem;color:var(--ph-muted);background:#e9ebf1;border-radius:999px;padding:3px 10px;text-align:center;max-width:92%}
.card{background:var(--ph-card);border:1px solid var(--ph-line);border-radius:14px;padding:10px;font-size:.82rem;max-width:100%}
.card .ct{display:flex;align-items:center;gap:6px;font-size:.68rem;color:var(--ph-muted);font-weight:700;margin-bottom:4px}
.card b.q{display:block;font-size:.88rem;margin-bottom:6px}
.opt{display:flex;justify-content:space-between;width:100%;position:relative;overflow:hidden;border:1px solid var(--ph-line);background:#fafbfd;border-radius:9px;padding:6px 9px;margin-top:5px;text-align:left;font-size:.8rem}
.opt i{position:absolute;inset:0 auto 0 0;background:var(--brand-soft)}
.opt span{position:relative}
.opt.mine{border-color:var(--brand)}
.cta{border:0;background:var(--brand);color:var(--brand-ink);border-radius:9px;padding:6px 11px;font-weight:700;font-size:.78rem}
.cta.out{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.adc{display:flex;gap:10px;align-items:center}
.tile{width:42px;height:42px;border-radius:11px;flex:none;display:grid;place-items:center;color:#fff;font:700 .9rem var(--f-display)}
.timer{display:flex;align-items:center;gap:10px}
.timer .big{font:700 1.3rem var(--f-display);color:var(--brand);min-width:62px}
.share{margin:0 10px 6px;background:#e9f8f3;border:1px solid #b9e3d3;border-radius:12px;padding:8px 10px;font-size:.78rem;display:flex;gap:8px;align-items:center}
.share span{flex:1}
.gate{margin:0 10px 6px;background:#eef0fb;border-radius:12px;padding:7px 10px;font-size:.74rem;color:#4b4f8a}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 10px 6px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--ph-line);background:var(--ph-card);border-radius:999px;padding:5px 10px;font-size:.74rem;color:var(--ph-text)}
.comp{display:flex;gap:6px;align-items:center;padding:8px 10px 12px;background:var(--ph-card);border-top:1px solid var(--ph-line)}
.comp input{flex:1;min-width:0;border:1px solid var(--ph-line);border-radius:999px;padding:8px 12px;background:var(--ph-bg);color:var(--ph-text);font-size:.84rem}
.comp .plus,.comp .send{width:34px;height:34px;flex:none;border-radius:50%;border:0;font-weight:700}
.comp .plus{background:var(--ph-bg);color:var(--ph-text);font-size:1.1rem}
.comp .send{background:var(--brand);color:var(--brand-ink)}
.ro{display:flex;gap:8px;align-items:center;padding:10px 12px 14px;background:var(--ph-card);border-top:1px solid var(--ph-line);font-size:.78rem;color:var(--ph-muted)}
.ro span{flex:1}
.mact{display:flex;gap:6px;margin-top:6px}
.mact button{border:1px solid var(--ph-line);background:#fff;border-radius:7px;font-size:.7rem;padding:3px 7px;color:var(--ph-text)}
.ov{position:absolute;inset:0;background:rgba(15,20,35,.38);display:flex;align-items:flex-end;z-index:5}
.sheet{width:100%;max-height:86%;overflow:auto;background:var(--ph-card);border-radius:20px 20px 0 0;padding:14px 14px 18px;color:var(--ph-text)}
.sheet h4{margin:0 0 4px;font-size:1rem}
.sheet p{margin:0 0 10px;color:var(--ph-muted);font-size:.8rem}
.sh-x{float:right;border:0;background:var(--ph-bg);border-radius:8px;padding:3px 8px;color:var(--ph-text)}
.grid-a{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ga{border:1px solid var(--ph-line);background:#fafbfd;border-radius:12px;padding:10px 6px;font-size:.74rem;text-align:center;color:var(--ph-text);display:grid;gap:4px;justify-items:center}
.ga .ic{width:30px;height:30px;border-radius:9px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:800}
.ga.red .ic{background:#fde4e6;color:#d1263a}
.list-b{display:grid;gap:6px}
.list-b button{text-align:left;border:1px solid var(--ph-line);background:#fafbfd;border-radius:10px;padding:9px 10px;font-size:.82rem;color:var(--ph-text)}
.list-b button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.sheet textarea,.sheet input[type=text]{width:100%;border:1px solid var(--ph-line);border-radius:10px;padding:8px;background:var(--ph-bg);color:var(--ph-text);font-size:.84rem}
.ttt{display:grid;grid-template-columns:repeat(3,72px);gap:6px;justify-content:center;margin:10px 0}
.ttt button{height:72px;border-radius:12px;border:1px solid var(--ph-line);background:#fafbfd;font:700 1.6rem var(--f-display);color:var(--ph-text)}
.ttt button.o{color:var(--brand)}
.track{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin:10px 0}
.track div{height:30px;border-radius:7px;background:#eef0f5;display:flex;align-items:center;justify-content:center;gap:2px;font-size:.6rem;color:#9aa1b5;position:relative}
.track div.home{background:var(--brand-soft);color:var(--brand);font-weight:800}
.tok{width:10px;height:10px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.dice{font:700 1.5rem var(--f-display);text-align:center}
.menu{position:absolute;right:10px;top:132px;z-index:6;background:#fff;border:1px solid var(--ph-line);border-radius:12px;box-shadow:0 14px 30px rgba(20,25,45,.18);padding:6px;display:grid;min-width:200px}
.menu button{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:8px;font-size:.82rem;color:var(--ph-text)}
.menu button:hover{background:var(--ph-bg)}
.scrn{flex:1;display:grid;place-content:center;gap:10px;text-align:center;padding:24px}
.scrn h4{margin:0;font-size:1.1rem}
.scrn p{margin:0;color:var(--ph-muted);font-size:.84rem}
.scrn .big{font:700 2rem var(--f-display);color:var(--brand)}
.stars{display:flex;gap:4px}
.stars button{border:0;background:transparent;font-size:1.3rem;color:#c8ccd8;padding:0}
.stars button.on{color:#f2a516}

/* consoles */
.console{display:grid;grid-template-columns:200px minmax(0,1fr) 390px;gap:16px;align-items:start;max-width:1600px;margin:0 auto}
.cnav{position:sticky;top:76px;display:grid;gap:4px}
.cnav button{display:flex;justify-content:space-between;align-items:center;text-align:left;border:1px solid transparent;background:transparent;color:var(--muted);padding:9px 12px;border-radius:10px;font-weight:600;font-size:.88rem}
.cnav button[aria-pressed="true"]{background:var(--panel);border-color:var(--line);color:var(--text)}
.cnav .who{font:500 .7rem var(--f-mono);color:var(--dim);padding:6px 12px 10px;letter-spacing:.08em;text-transform:uppercase}
.cnum{font:600 .7rem var(--f-mono);background:var(--rose);color:#1b0609;border-radius:999px;padding:1px 7px}
.cmain{min-width:0;display:grid;gap:14px}
.live{position:sticky;top:76px;display:grid;gap:10px;justify-items:center}
.live .lt{font:500 .7rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.ch{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ch h2{margin:0;font:700 1.3rem/1.2 var(--f-display);letter-spacing:-.01em}
.ch p{margin:4px 0 0;color:var(--muted);font-size:.86rem;max-width:70ch}
.fil{display:flex;gap:6px;flex-wrap:wrap}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:rgba(17,26,47,.86)}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 .66rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
tr:last-child td{border-bottom:0}
td small{display:block;color:var(--dim);font-size:.74rem}
tr.click{cursor:pointer}
tr.click:hover td{background:rgba(255,255,255,.02)}

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  timing:{open_before_min:180,readonly_after_min:120,purge_days:7},quiet:{from:'23:00',to:'06:00'},
  ads:{gap_min:45,max_per_trip:4,block_after_alert_min:15},social_min:3,slow_mode_sec:10,report_hide_at:2,issue_escalate_at:3};}
const FEATURE_LABELS={chat:'Group chat',alerts:'Ops alerts',tara:'Tara (AI)',location_crowd:'Crowd location',polls:'Polls',surveys:'Surveys',games:'Games',ads:'Ads',sos:'Private SOS',issues:'Group issue reporting',wait_for_me:'Wait for me',rest_stop:'Rest-stop timer',lost_found:'Lost & found',vouchers:'Delay vouchers'};
const QUICK={bus:['Where is the bus?','Need a charger','Is the AC too cold?','How long is the stop?'],train:['Where is the train?','Which platform?','Pantry open?','Charging point working?'],flight:['New departure time?','Gate change?','Meal vouchers?','Baggage belt?']};
const ISSUES={bus:['AC not working','Charging point not working','Cleanliness','Rash driving','Bus skipped my stop'],train:['AC not working','Charging point not working','Cleanliness','No water in washroom','Unauthorised people in coach'],flight:['No updates at the gate','Long queue at boarding','Need food or water during delay','Bag not on belt']};
const ADJ=['Amber','Quiet','Misty','Brave','Silver','Lucky','Sunny','Swift','Calm','Golden','Indigo','Mellow','Rapid','Cosmic','Gentle','Bright','Jolly','Coral','Velvet','Rustic','Breezy','Nimble'];
const ANI=['Owl','Tiger','Heron','Otter','Falcon','Panda','Koala','Lynx','Dolphin','Fox','Peacock','Gecko','Sparrow','Robin','Yak','Kingfisher','Bison','Mynah','Langur','Pangolin','Hornbill','Squirrel'];
function handles(n,exclude){const out=[];const used=new Set(exclude||[]);let g=0;while(out.length<n&&g<500){g++;const h=pick(ADJ)+' '+pick(ANI);if(!used.has(h)){used.add(h);out.push(h);}}return out;}

/* ---------- state ---------- */
const S={view:'app',tenant:'bus',play:true,now:toMin('22:22'),lang:'en',draft:'',lastSend:0,forceBottom:true,sheet:null,menu:false,msgMenu:null,muted:new Set(),notifMuted:false,
  rooms:{},order:[],scenario:{bus:'r_bus',train:'r_train',flight:'r_flight'},inbox:[],events:[],audit:[],campaigns:[],seen:new Set(),game:null,crew:false,
  config:{bus:cfg(),train:cfg({wait_for_me:false,rest_stop:false}),flight:cfg({location_crowd:false,wait_for_me:false,rest_stop:false})},

    bc:{vertical:'bus',field:'route',value:'',text:'',sev:'warning',push:true,sms:true},replyFor:null},
  mkt:{page:'overview',sel:'c1',d:null},

const room=()=>S.rooms[S.scenario[S.tenant]];
const C=r=>S.config[r.tenant];

/* schedule: points [min,pos] with optional dwell */
function points(r){const pts=[];let add=0,prev=-1;r.stops.forEach((s,i)=>{let a=toMin(s.t)+add;if(a<prev){add+=1440;a+=1440;}pts.push([a,i]);prev=a;if(s.d){let d=toMin(s.d)+add;if(d<a){add+=1440;d+=1440;}pts.push([d,i]);prev=d;}});return pts;}
function arr(r,i){const p=points(r).find(x=>x[1]===i);return p?p[0]:0;}
function dep(r,i){const ps=points(r).filter(x=>x[1]===i);return ps[ps.length-1][0];}
function posAt(r,clock){const pts=points(r),t=clock-r.delay;if(t<=pts[0][0])return 0;for(let k=0;k<pts.length-1;k++){const a=pts[k],b=pts[k+1];if(t>=a[0]&&t<=b[0]){return b[0]===a[0]?b[1]:a[1]+(b[1]-a[1])*(t-a[0])/(b[0]-a[0]);}}return pts[pts.length-1][1];}
const eta=(r,i)=>arr(r,i)+r.delay;
const lastIdx=r=>r.stops.length-1;
function place(r){const p=r.pos,i=Math.floor(p),f=p-i,s=r.stops;if(i>=lastIdx(r))return 'at '+s[lastIdx(r)].n;if(f<.12)return (p===i?'at ':'near ')+s[i].n;if(f>.88)return 'near '+s[i+1].n;return 'between '+s[i].n+' and '+s[i+1].n;}
function nextIdx(r){return Math.min(lastIdx(r),Math.floor(r.pos+1e-9)+1);}
function isQuiet(r){const q=C(r).quiet,m=((S.now%1440)+1440)%1440,a=toMin(q.from),b=toMin(q.to);return a>b?(m>=a||m<b):(m>=a&&m<b);}
function locInfo(r){const c=C(r);if(r.loc.gps)return {src:r.tenant==='bus'?'Bus GPS':'GPS',conf:'high',n:0};
  if(r.loc.feed)return {src:r.tenant==='train'?'Running status':'Flight status',conf:'high',n:0};

  if(n>=2)return {src:n+' travellers on board',conf:'high',n};if(n===1)return {src:'1 traveller on board',conf:'medium',n};return {src:'Timetable + last known point',conf:'estimated',n:0};}

/* ---------- seed rooms ---------- */
const BUS_STOPS=[{n:'Ameerpet',c:'AMRP',t:'21:30'},{n:'KPHB',c:'KPHB',t:'21:50'},{n:'Gachibowli',c:'GCBW',t:'22:15'},{n:'Kurnool',c:'KRNL',t:'01:30',d:'01:50',rest:true},{n:'Anantapur',c:'ATP',t:'04:10'},{n:'Bengaluru Majestic',c:'MJST',t:'07:00'}];

  add(t,{kind:'ops',sev:'info',pin:true,text:'Train is running 10 min late. Expected at Mahbubnagar at 10:45 PM, platform 2.',t:S.now-15});t.lastAlertAt=S.now-15;

/* ---------- Tara ---------- */
function taraLocation(r){const T=TEN[r.tenant],li=locInfo(r);
  if(r.tenant==='flight'){return r.pos>0?`${r.flight_no} is in the air and expected at ${r.stops[1].n} at ${fmt(eta(r,1))}.`:`${r.flight_no} is still at gate ${r.meta.gate}. New departure ${fmt(eta(r,0))} (${r.delay} min late).`;}
  const target=r.phase==='open'?r.board:r.drop;const mins=Math.max(0,Math.round(eta(r,target)-S.now));
  const src=li.conf==='estimated'?'No live source right now, so this is an estimate from the timetable.':`Source: ${li.src}.`;
  return `The ${T.u} is ${place(r)}. About ${dur(mins)} to ${r.stops[target].n}. ${src}`;}
function taraCatchUp(r){const recent=r.messages.slice(-25);const alerts=recent.filter(m=>m.kind==='ops');const chat=recent.filter(m=>m.kind==='text').length;
  const lastA=alerts.length?alerts[alerts.length-1].text:'No new Ops alerts.';return `Catch-up: ${chat} chat messages recently. Latest Ops update: ${lastA} ${TEN[r.tenant].unit} is ${place(r)}.`;}
function taraAnswer(r,text){const tl=text.toLowerCase();
  if(/catch me up|summar|missed/.test(tl))return taraCatchUp(r);
  if(r.tenant==='train'&&/platform/.test(tl))return `Platform ${r.meta.platform||'—'} at ${r.stops[nextIdx(r)].n}, expected ${fmt(eta(r,nextIdx(r)))}.`;
  if(r.tenant==='train'&&/pantry|dinner|food/.test(tl))return 'Pantry orders close after the next station. E-catering is available in the ixigo Trains app.';
  if(r.tenant==='flight'&&/gate/.test(tl))return `Gate ${r.meta.gate}, Terminal ${r.meta.terminal}. I’ll post here if it changes.`;
  if(r.tenant==='flight'&&/meal|voucher|food/.test(tl))return 'No meal voucher announcement yet. Ops will post here if the airline confirms.';
  if(r.tenant==='flight'&&/belt|baggage|bag/.test(tl))return r.meta.belt&&r.meta.belt!=='—'?`Belt ${r.meta.belt}.`:'The belt is announced after landing. I’ll post it here.';
  if(/where|cross|reach|eta|how far|location|new departure|depart|when|time/.test(tl))return taraLocation(r);
  if(/refund|cancel/.test(tl))return 'You can see cancellation charges for your ticket in My Trips. Ops can’t change refunds in this room.';
  if(/stop/.test(tl)&&r.tenant==='bus'){const rs=r.stops.findIndex(s=>s.rest);return rs>=0?`Rest stop at ${r.stops[rs].n} around ${fmt(eta(r,rs))} for about 20 min.`:'No rest stop on this trip.';}
  return 'I can help with location, ETA, stops, catch-ups and trip questions. Ask me anything about this trip.';}
function wantsTara(r,text){return /@tara/i.test(text)||r.members.length<C(r).social_min||/(where|cross|reach|eta|how far|location|platform|gate|catch me up|depart|belt|refund|new departure|how long|pantry)/i.test(text);}

/* ---------- moderation ---------- */
const BAD=/\b(idiot|stupid|bloody|shut up|nonsense fellow)\b/i;
function mask(t){return t.replace(/(?:\+?91[\s-]?)?\b[6-9]\d{4}[\s-]?\d{5}\b/g,'[number hidden]').replace(/\b[\w.+-]+@[\w-]+\.[\w.]+\b/g,'[email hidden]').replace(/(^|\s)@(?!tara\b)[a-z0-9_.]{3,}/gi,'$1[ID hidden]');}

/* ---------- actions on rooms ---------- */
function send(text){const r=room(),c=C(r);text=(text||'').trim();if(!text)return;
  if(r.opsOnly)return toast('Only Ops can post right now.');
  if(/(https?:\/\/|www\.)\S+/i.test(text))return toast('Links can’t be shared in trip rooms.');
  if(BAD.test(text))return toast('Not sent. Please keep the room respectful.');
  const gap=r.slow?30:c.slow_mode_sec;const wait=Math.ceil(gap-(Date.now()-S.lastSend)/1000);
  if(S.lastSend&&wait>0)return toast(`Slow mode: you can send again in ${wait} s.`);
  const masked=mask(text);if(masked!==text)toast('Phone numbers and IDs are hidden automatically.');
  add(r,{kind:'text',who:r.me,me:true,text:masked});S.draft='';S.lastSend=Date.now();S.forceBottom=true;
  emit('message.created',r,`${r.me}: “${masked.slice(0,40)}”`);
  if(c.features.tara&&wantsTara(r,masked)){later(900,()=>{add(r,{kind:'tara',text:taraAnswer(r,masked)});emit('bot.replied',r,'Tara answered a trip question');});}
  if(/charger|charging cable|type-?c/i.test(masked)&&r.members.length>=c.social_min){later(2600,()=>{add(r,{kind:'text',who:r.members[1].h,text:'I have a spare type-C. Passing it down the aisle.'});});}
  if(/ac too cold|ac is cold/i.test(masked)&&r.members.length>=c.social_min){later(2200,()=>{add(r,{kind:'text',who:r.members[3].h,text:'Same here, quite cold at the back.'});});}
  refresh();}
function later(ms,fn){setTimeout(()=>{fn();S.forceBottom=true;refresh();},ms);}
function opsPost(r,text,sev,opts){opts=opts||{};r.messages.forEach(m=>{if(m.kind==='ops')m.pin=false;});
  const m=add(r,{kind:'ops',sev:sev||'warning',pin:true,text,author:opts.author||'ops.ravi'});
  emit('announcement.created',r,`${sev} · push ${opts.push!==false?'on':'off'} · SMS ${opts.sms?'on':'off'}`);
  if(opts.sms)emit('notification.sms_sent',r,`SMS to ${Math.max(1,Math.round(r.members.length*.2))} offline travellers`);
  if(r.scenario)S.forceBottom=true;return m;}
function inbox(type,r,title,detail,sev,mine){const it={id:uid('a'),type,sev,room:r.id,title,detail,ts:Date.now(),status:'open',mine:!!mine};S.inbox.unshift(it);
  const map={sos:'sos.raised',issue:'issue.escalated',wait:'wait_request.raised',report:'message.reported',lost:'lost_found.created'};emit(map[type]||type,r,title);return it;}
function privateMsg(r,text,from){add(r,{kind:'priv',text,from:from||TEN[r.tenant].ops});S.forceBottom=true;}
function setPhase(r,p){if(r.phase===p)return;r.phase=p;S.sheet=null;S.menu=false;
  if(p==='onboard')add(r,{kind:'sys',text:r.tenant==='flight'?'Boarding complete. Have a good flight.':`You’re on board. Welcome!`});
  if(p==='readonly'){add(r,{kind:'sys',text:'Trip complete. The room is now read-only for 2 hours.'});add(r,{kind:'rate'});
    if(r.tenant==='bus')add(r,{kind:'p2',sub:'return',title:'Book your return: Bengaluru → Hyderabad',body:'Sunrise Travels has seats on Fri 9 Oct, 10:00 PM.',cta:'See buses'});}
  emit('room.state_changed',r,'Room is now '+PHL[p]);S.forceBottom=true;}
const PHL={scheduled:'Scheduled',open:'Open (waiting)',onboard:'On the way',readonly:'Read-only',closed:'Closed'};

/* ---------- ads & campaigns ---------- */
function adCheck(r,c){const cf=C(r);if(!cf.features[c.type==='survey'?'surveys':(c.type==='sponsored_poll'?'polls':(c.type==='game'?'games':'ads'))])return {ok:false,why:'feature off for tenant'};
  if(c.status!=='live')return {ok:false,why:'campaign not live'};
  if(!c.v.includes(r.tenant))return {ok:false,why:'vertical not targeted'};
  if(c.routes.length&&!c.routes.includes(r.route))return {ok:false,why:'route not targeted'};
  if(!c.phases.includes(r.phase))return {ok:false,why:'room stage '+PHL[r.phase]};
  const isAd=c.type!=='survey';
  if(isQuiet(r)&&c.type!=='survey')return {ok:false,why:'quiet hours'};
  if(isAd){if(r.breakdown)return {ok:false,why:'breakdown in progress'};
    if(S.now-r.lastAlertAt<cf.ads.block_after_alert_min)return {ok:false,why:'Ops alert in last '+cf.ads.block_after_alert_min+' min'};
    if(S.now-r.lastAdAt<cf.ads.gap_min)return {ok:false,why:'1 ad per '+cf.ads.gap_min+' min'};
    if(r.adCount>=cf.ads.max_per_trip)return {ok:false,why:'max '+cf.ads.max_per_trip+' per trip'};}
  if(c.type==='stop_offer'){const i=r.stops.findIndex(s=>s.n===c.stop);if(i<0)return {ok:false,why:'stop not on route'};const d=eta(r,i)-S.now;if(d>60||r.pos>i+.01)return {ok:false,why:'more than 60 min from '+c.stop};}
  return {ok:true};}
function deliver(r,c,force){if(c.del[r.id])return false;const chk=adCheck(r,c);
  if(!chk.ok){if(c.log.length===0||c.log[0].why!==chk.why||c.log[0].room!==r.id)c.log.unshift({room:r.id,ok:false,why:chk.why,ts:Date.now()});if(force)toast('Held back: '+chk.why+'.');return false;}
  c.del[r.id]=true;if(c.log.length>30)c.log.length=30;c.log.unshift({room:r.id,ok:true,why:'delivered',ts:Date.now()});
  if(c.type==='sponsored_poll')add(r,{kind:'poll',camp:c.id,by:c.adv,q:c.poll.q,opts:c.poll.opts.map(t=>({t,v:Math.floor(Math.random()*6)+1})),sponsored:true});
  else if(c.type==='survey')add(r,{kind:'survey',camp:c.id,by:c.adv,qs:c.survey.qs,step:0,ans:[]});
  else if(c.type==='game')add(r,{kind:'invite',game:'trivia',camp:c.id,by:'Tara',text:c.cr.title+' starts now. '+c.cr.body+'.'});
  else add(r,{kind:'ad',camp:c.id,cr:c.cr,adv:c.adv,stop:c.type==='stop_offer'?c.stop:null});
  if(c.type!=='survey'){r.adCount++;r.lastAdAt=S.now;}
  emit(c.type==='survey'?'survey.delivered':'ad.delivered',r,c.name+' · '+c.adv);S.forceBottom=true;return true;}
function campaignTick(){Object.values(S.scenario).forEach(id=>{const r=S.rooms[id];if(['scheduled','closed'].includes(r.phase))return;
  for(const c of S.campaigns){if(c.status==='live'&&!c.del[r.id]){if(deliver(r,c))break;}}});}

/* ---------- clock ---------- */
function advance(dt){S.now+=dt;S.order.forEach(id=>{const r=S.rooms[id];if(r.breakdown){r.delay+=dt;return;}
  const before=r.pos;r.pos=posAt(r,S.now);const crossed=[];for(let i=Math.floor(before)+1;i<=Math.floor(r.pos+1e-9);i++)crossed.push(i);
  crossed.forEach(i=>{const s=r.stops[i];if(!s)return;
    if(r.scenario){if(r.tenant==='flight'){if(i===lastIdx(r)){add(r,{kind:'sys',text:'Landed at '+s.n+'.'});r.meta.belt='4';}}
      else add(r,{kind:'sys',text:`${TEN[r.tenant].unit} reached ${s.n} at ${fmt(S.now)}.`});
      if(s.rest&&C(r).features.rest_stop){add(r,{kind:'timer',stop:s.n,leaveAt:dep(r,i)+r.delay});emit('trip_event.rest_stop_started',r,'Stopped at '+s.n);}
      if(r.phase==='open'&&i>=r.board&&r.tenant!=='flight')setPhase(r,'onboard');
      if(i===r.drop-1&&r.tenant==='bus')add(r,{kind:'p2',sub:'cab',title:'Cab from '+r.stops[r.drop].n,body:'Partner cab, pre-filled pickup at your drop point. Fixed fare shown before booking.',cta:'Book cab'});}
    emit('location.updated',r,`${TEN[r.tenant].unit} reached ${s.n}`);});
  if(r.scenario&&r.tenant==='flight'&&r.phase==='open'&&r.pos>0)setPhase(r,'onboard');
  if(r.scenario&&r.phase==='onboard'&&r.pos>=lastIdx(r))setPhase(r,'readonly');});}
let ticks=0;
function tick(){if(!S.play)return;ticks++;advance(1);if(ticks%4===0)campaignTick();
  if(ticks%9===0){const r=room();if(r.members.length>=C(r).social_min&&['open','onboard'].includes(r.phase)&&!r.opsOnly){const lines=CHAT[r.tenant];const l=lines[(ticks/9)%lines.length|0];add(r,{kind:'text',who:pick(r.members.filter(m=>!m.me)).h,text:l});}}
  paintTick();}
const CHAT={bus:['Anyone else boarding at Gachibowli?','Is there a washroom break before Kurnool?','The bus is quite comfortable today.','Can someone confirm the bus number plate color?'],

const R={};
function paintEl(el){const name=el.dataset.region;if(!R[name])return;const ae=document.activeElement;let keep=null;
  if(ae&&el.contains(ae)&&ae.id){keep={id:ae.id,s:ae.selectionStart,e:ae.selectionEnd};}
  const feed=el.querySelector('.feed');let fs=null;if(feed){fs={top:feed.scrollTop,bottom:feed.scrollHeight-feed.scrollTop-feed.clientHeight<60};}
  el.innerHTML=R[name]();
  el.querySelectorAll('[data-region]').forEach(paintEl);
  const nf=el.querySelector('.feed');if(nf){if(S.forceBottom||!fs||fs.bottom)nf.scrollTop=nf.scrollHeight;else nf.scrollTop=fs.top;}
  if(keep){const k=document.getElementById(keep.id);if(k){k.focus();try{if(keep.s!=null)k.setSelectionRange(keep.s,keep.e);}catch(e){}}}}
function paint(name){document.querySelectorAll('[data-region="'+name+'"]').forEach(paintEl);}
function refresh(){const tops=[...document.querySelectorAll('#view [data-region]')].filter(el=>!el.parentElement||!el.parentElement.closest('[data-region]'));tops.forEach(paintEl);paint('clock');S.forceBottom=false;}

function phoneInner(r){const T=TEN[r.tenant];let body;
  if(r.left)body=`<div class="scrn"><h4>You left this room</h4><p>${esc(T.ops)} alerts still reach you by push and SMS.</p><div><button class="cta" data-act="rejoin">Rejoin room</button></div></div>`;

function schedScreen(r){const T=TEN[r.tenant],open=eta(r,0)-C(r).timing.open_before_min;return `<div class="rh"><div class="rh-t"><b>${esc(r.title)}</b><small>${esc(r.sub)}</small></div></div>

function roomScreen(r){const T=TEN[r.tenant],c=C(r),li=locInfo(r);const gated=r.members.length<c.social_min;

  let strip='';

  else{const target=r.phase==='open'?r.board:r.drop;const mins=Math.max(0,Math.round(eta(r,target)-S.now));

  const share=(r.tenant!=='flight'&&c.features.location_crowd&&r.phase==='onboard'&&!r.loc.mine&&r.sharePrompt&&!r.loc.gps&&!r.loc.feed)?`<div class="share"><span><b>Help others track this ${T.u}.</b> Share your location while on board. It stops at your drop point.</span><button class="cta" data-act="share" data-on="1">Share</button><button class="cta out" data-act="share" data-on="0">Not now</button></div>`:'';
  const gate=gated?`<div class="gate">Group chat opens when ${c.social_min}+ travellers join. Until then, ask Tara, get alerts, track the ${T.u} and play games with Tara.</div>`:'';
  const chips=(r.phase==='readonly')?'':`<div class="chips">${QUICK[r.tenant].map(q=>`<button data-act="quick" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>`;
  let comp;
  if(r.phase==='readonly')comp=`<div class="ro"><span>Read-only after the trip.</span>${c.features.lost_found?'<button class="cta out" data-act="sheet" data-s="lost">Lost &amp; found</button>':''}</div>`;
  else if(r.opsOnly)comp=`<div class="ro"><span>Only ${esc(T.ops)} can post right now.</span></div>`;
  else comp=`<form class="comp" data-submit="send"><button type="button" class="plus" data-act="sheet" data-s="plus" aria-label="More actions">+</button><input id="composer" autocomplete="off" aria-label="Message" placeholder="${gated?'Ask Tara…':'Message the room'}" value="${esc(S.draft)}"><button class="send" aria-label="Send">➤</button></form>`;
  return `<div class="rh"><div class="rh-t"><b>${esc(r.title)}</b><small>${esc(r.sub)} · ${r.members.length} travellers</small></div>${c.features.sos?'<button class="sos" data-act="sheet" data-s="sos">SOS</button>':''}<button class="kebab" data-act="menu" aria-label="Room menu">⋮</button></div>
  ${pinned?`<div class="pin ${pinned.sev==='critical'?'crit':''}"><b>${esc(T.ops)}</b><span>${esc(tr(pinned))}</span></div>`:''}${strip}${quiet}
  <div class="feed" id="feed">${feed}</div>${share}${gate}${chips}${comp}${S.menu?menuHTML(r):''}${S.sheet?`<div class="ov" data-act="closeSheet" data-self="1"><div class="sheet">${sheetHTML(r)}</div></div>`:''}`;}
function tr(m){return S.lang==='hi'&&m.hi?m.hi:m.text;}
function msgHTML(r,m){const T=TEN[r.tenant];const time=`<time>${fmt(m.t)}</time>`;

  case 'voucher':return `<div class="card"><div class="ct">${esc(T.ops)} · for the delay</div><b class="q">₹${m.amount} travel voucher</b><span style="color:var(--ph-muted)">Valid on your next ${T.u} booking for 30 days.</span><div style="margin-top:8px">${m.claimed?'<span class="ct">Claimed · added to your wallet</span>':`<button class="cta" data-act="claim" data-id="${m.id}">Claim</button>`}</div></div>`;
  case 'issue':{const esc8=C(r).issue_escalate_at;return `<div class="card"><div class="ct">Issue reported</div><b class="q">${esc(m.label)}</b><span style="color:var(--ph-muted)">${m.count} traveller${m.count>1?'s':''} reported this${m.escalated?' · sent to '+esc(T.ops):` · goes to Ops at ${esc8}`}</span><div style="margin-top:8px">${m.metoo?'<span class="ct">You reported this</span>':`<button class="cta out" data-act="metoo" data-id="${m.id}">Me too</button>`}</div></div>`;}

  case 'lost':return `<div class="card"><div class="ct">Lost &amp; found · sent to Ops</div>${esc(m.text)}</div>`;
  case 'rate':return `<div class="card"><div class="ct">Rate your trip</div><div class="stars">${[1,2,3,4,5].map(n=>`<button class="${r.rated>=n?'on':''}" data-act="rate" data-v="${n}" aria-label="${n} stars">★</button>`).join('')}</div>${r.rated?'<span class="ct" style="margin-top:4px">Thanks for rating.</span>':''}</div>`;
  case 'p2':return `<div class="card"><div class="ct">${esc(m.sub==='cab'?'Last-mile cab':m.sub==='return'?'Return trip':'Offer')} <span class="bd p2">Phase 2</span></div><b class="q">${esc(m.title)}</b><span style="color:var(--ph-muted)">${esc(m.body)}</span><div style="margin-top:8px"><button class="cta out" data-act="p2click" data-t="${esc(m.cta)}">${esc(m.cta)}</button></div></div>`;

function seenImp(m){if(!m.camp||S.seen.has(m.id)||S.view==='mkt'&&false)return;S.seen.add(m.id);const c=S.campaigns.find(x=>x.id===m.camp);if(c)c.st.imp++;}
function menuHTML(r){return `<div class="menu" role="menu"><button data-act="lang">Read in: ${S.lang==='en'?'English → हिन्दी':'हिन्दी → English'} <span class="bd p2">Phase 2</span></button><button data-act="notif">${S.notifMuted?'Unmute notifications':'Mute notifications'}</button><button data-act="sheet" data-s="rules">Room safety rules</button><button data-act="sheet" data-s="catch">Catch me up</button><button data-act="leave">Leave room</button></div>`;}

/* ---------- sheets ---------- */
function sheetHTML(r){const T=TEN[r.tenant],c=C(r),s=S.sheet,x='<button class="sh-x" data-act="closeSheet">Close</button>';

  if(s.t==='game-list')return `${x}<h4>Games</h4><p>${gated?'Multiplayer opens at '+c.social_min+'+ travellers. Play with Tara for now.':'Play with Tara, or invite the room.'}</p><div class="list-b"><button data-act="game" data-g="ttt">Tic-tac-toe with Tara</button><button data-act="invite" data-g="ttt" ${gated?'disabled':''}>Tic-tac-toe: invite the room</button><button data-act="game" data-g="ludo">Ludo lite (you, Tara + 2 travellers)</button><button data-act="game" data-g="trivia">Trip trivia, hosted by Tara</button></div>`;

  if(s.t==='sos')return `${x}<h4>Send SOS to ${esc(T.ops)}?</h4><p>Only Ops sees this, with your trip and live location. It is never shown in the room.</p><div class="list-b">${['I feel unsafe','Medical help needed','Harassment','Other emergency'].map(o=>`<button data-act="sosR" data-v="${esc(o)}" aria-pressed="${s.reason===o}">${esc(o)}</button>`).join('')}</div><div style="margin-top:12px;display:flex;gap:8px"><button class="cta" style="background:#e5333f" data-act="sosSend" ${s.reason?'':'disabled'}>Send SOS</button></div><p style="margin-top:10px">For immediate danger, call 112.</p>`;

  if(s.t==='lost')return `${x}<h4>Lost &amp; found</h4><p>Describe the item. Ops and travellers on this trip will see it until the room closes.</p><textarea id="lostText" rows="3" data-bind="sheet.text" placeholder="e.g. Black backpack, left on an upper berth">${esc(s.text||'')}</textarea><div style="margin-top:10px"><button class="cta" data-act="lostSend">Post</button></div>`;
  if(s.t==='rules')return `${x}<h4>Room safety rules</h4><div class="list-b" style="pointer-events:none"><button>No private messages between travellers</button><button>Handles never show name, gender, seat or number</button><button>No photos or links from travellers</button><button>Phone numbers and IDs are hidden automatically</button><button>Report or mute anyone by tapping their message</button><button>SOS goes to Ops only</button></div>`;
  if(s.t==='food')return `${x}<h4>Pre-order at Kurnool <span class="bd p2">Phase 2</span></h4><p>Pick up at the counter without queueing. Pay on pickup.</p><div class="list-b">${['Veg thali · ₹180','Chicken biryani · ₹240','Idli vada · ₹90'].map(o=>`<button data-act="food" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
  if(s.t==='map')return x+mapHTML(r);
  return x;}
function mapHTML(r){const T=TEN[r.tenant],li=locInfo(r),n=r.stops.length,W=320,pad=24;const X=i=>pad+(W-2*pad)*i/(n-1);const Y=i=>70+Math.sin(i*1.3)*22;
  const bp=r.pos,bi=Math.floor(bp),bf=bp-bi;const bx=bi>=n-1?X(n-1):X(bi)+(X(bi+1)-X(bi))*bf,by=bi>=n-1?Y(n-1):Y(bi)+(Y(bi+1)-Y(bi))*bf;
  let path='M'+X(0)+' '+Y(0);for(let i=1;i<n;i++)path+=' L'+X(i)+' '+Y(i);
  const lbl=r.stops.map((s,i)=>`<circle cx="${X(i)}" cy="${Y(i)}" r="4" fill="${i===r.board||i===r.drop?'var(--brand)':'#aab0c2'}"/><text x="${X(i)}" y="${Y(i)+(i%2?-12:20)}" font-size="9" text-anchor="middle" fill="#677089">${esc((s.c||s.n).slice(0,6))}</text>`).join('');
  const canShare=r.tenant!=='flight'&&C(r).features.location_crowd;const onboard=r.phase==='onboard';
  return `<h4>${T.unit} location</h4><p>${esc(TEN[r.tenant].unit+' '+place(r))}. Source: ${esc(li.src)}.</p>
  <svg viewBox="0 0 ${W} 130" width="100%" role="img" aria-label="Route map"><path d="${path}" stroke="#cfd4e2" stroke-width="4" fill="none" stroke-linecap="round"/>${lbl}<circle cx="${bx}" cy="${by}" r="9" fill="var(--brand)" opacity=".25"/><circle cx="${bx}" cy="${by}" r="5.5" fill="var(--brand)"/></svg>
  <div class="list-b" style="pointer-events:none">${r.stops.map((s,i)=>i<Math.floor(r.pos)?'':`<button>${esc(s.n)}${i===r.board?' · your boarding':''}${i===r.drop?' · your drop':''}<span style="float:right">${fmt(eta(r,i))}</span></button>`).join('')}</div>
  <p style="margin-top:10px"><span class="cf ${li.conf}">${li.conf}</span> ${li.conf==='high'?'Fresh and confirmed by 2+ sources.':li.conf==='medium'?'One source, or older than 3 min.':'No live source. Estimated from the timetable.'}</p>
  ${canShare?`<div class="tog" style="margin-top:8px;color:var(--ph-text)"><span>Share my location while on board<br><small style="color:var(--ph-muted)">${onboard?'Stops automatically at your drop point. Never linked to your handle.':'Available once you’re on board.'}</small></span><button class="sw" role="switch" aria-checked="${r.loc.mine}" data-act="share" data-on="${r.loc.mine?0:1}" ${onboard?'':'disabled'} aria-label="Share location"></button></div>`:''}`;}

/* ---------- games ---------- */
const TRIVIA={bus:[['Which city is called the Silicon Valley of India?',['Hyderabad','Bengaluru','Pune'],1],['Kurnool lies on the banks of which river?',['Krishna','Godavari','Tungabhadra'],2],['Charminar is in which city?',['Hyderabad','Chennai','Mysuru'],0]],
  train:[['What does “3A” mean on a train ticket?',['AC 3-tier','Third class','Seat 3A'],0],['Station code YPR stands for?',['Yesvantpur','Yelahanka','Yadgir'],0],['Indian Railways’ PNR has how many digits?',['8','10','12'],1]],
  flight:[['BLR is the airport code for?',['Belagavi','Bengaluru','Bareilly'],1],['HYD airport is named after?',['Rajiv Gandhi','Indira Gandhi','Netaji Bose'],0],['What does “ETD” stand for?',['Estimated time of departure','Expected terminal door','Exit to departures'],0]]};
function startGame(g,r){if(g==='ttt')S.game={t:'ttt',b:Array(9).fill(''),over:null,vs:S._vs||'Tara'};
  if(g==='ludo')S.game={t:'ludo',p:[{n:'You',pos:0,c:'var(--brand)'},{n:'Tara',pos:0,c:'#6b5cf0'},{n:r.members[1]?r.members[1].h:'Amber Owl',pos:0,c:'#139a6e'},{n:r.members[2]?r.members[2].h:'Misty Heron',pos:0,c:'#e0a000'}],turn:0,die:null,win:null,log:'Roll to start. Land on someone to send them back.'};
  if(g==='trivia')S.game={t:'trivia',i:0,score:0,a:null,qs:TRIVIA[r.tenant]};
  S._vs=null;S.sheet={t:'game'};emit('game.started',r,g);}
function tttWin(b){const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];for(const l of L){if(b[l[0]]&&b[l[0]]===b[l[1]]&&b[l[1]]===b[l[2]])return b[l[0]];}return b.every(Boolean)?'draw':null;}
function tttAI(b){const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];for(const who of ['O','X'])for(const l of L){const v=l.map(i=>b[i]);if(v.filter(x=>x===who).length===2&&v.includes('')) return l[v.indexOf('')];}if(!b[4])return 4;const free=b.map((v,i)=>v?null:i).filter(v=>v!=null);return pick(free);}
function gameHTML(r){const g=S.game;if(!g)return '';
  if(g.t==='ttt'){const st=g.over?(g.over==='draw'?'Draw!':g.over==='X'?'You win!':g.vs+' wins!'):'You are X. '+g.vs+' is O.';
    return `<h4>Tic-tac-toe vs ${esc(g.vs)}</h4><p>${st}</p><div class="ttt">${g.b.map((v,i)=>`<button class="${v==='O'?'o':''}" data-act="ttt" data-i="${i}" ${v||g.over?'disabled':''} aria-label="Cell ${i+1}">${v}</button>`).join('')}</div>${g.over?'<button class="cta" data-act="game" data-g="ttt">Play again</button>':''}`;}
  if(g.t==='ludo'){const N=24;let cells='';for(let i=0;i<=N;i++){const toks=g.p.filter(p=>p.pos===i).map(p=>`<span class="tok" style="background:${p.c}" title="${esc(p.n)}"></span>`).join('');cells+=`<div class="${i===N?'home':''}">${toks||(i===0?'Start':i===N?'Home':i)}</div>`;}
    return `<h4>Ludo lite</h4><p>${esc(g.log)}</p><div class="track">${cells}</div><div style="display:flex;gap:10px;align-items:center;justify-content:space-between">${g.p.map(p=>`<span style="font-size:.7rem;display:flex;gap:4px;align-items:center"><span class="tok" style="background:${p.c}"></span>${esc(p.n.split(' ')[0])}</span>`).join('')}</div>
    <div style="display:flex;gap:10px;align-items:center;margin-top:10px"><span class="dice">${g.die||'–'}</span>${g.win?`<b>${esc(g.win)} wins!</b> <button class="cta" data-act="game" data-g="ludo">Again</button>`:`<button class="cta" data-act="roll" ${g.turn!==0?'disabled':''}>${g.turn===0?'Roll dice':esc(g.p[g.turn].n)+' is rolling…'}</button>`}</div>`;}
  if(g.t==='trivia'){if(g.i>=g.qs.length)return `<h4>Trip trivia</h4><p>You scored ${g.score} of ${g.qs.length}.</p><button class="cta" data-act="game" data-g="trivia">Play again</button>`;
    const q=g.qs[g.i];return `<h4>Trip trivia · ${g.i+1}/${g.qs.length}</h4>${S.campaigns.find(c=>c.id==='c5').status==='live'?'<p>Sponsored by Sample Cola</p>':'<p>Hosted by Tara</p>'}<b class="q" style="display:block;margin-bottom:6px">${esc(q[0])}</b><div class="list-b">${q[1].map((o,i)=>`<button data-act="trivia" data-i="${i}" ${g.a!=null?'disabled':''} aria-pressed="${g.a===i}">${esc(o)}${g.a!=null&&i===q[2]?' ✓':''}</button>`).join('')}</div>${g.a!=null?`<div style="margin-top:10px"><button class="cta" data-act="trivNext">${g.i+1<g.qs.length?'Next':'See score'}</button></div>`:''}`;}
  return '';}
function ludoMove(i){const g=S.game;if(!g||g.win)return;const d=1+Math.floor(Math.random()*6);g.die=d;const p=g.p[i];const N=24;
  if(p.pos+d>N){g.log=`${p.n} rolled ${d}. Needs an exact roll to get home.`;}
  else{p.pos+=d;g.log=`${p.n} rolled ${d}.`;g.p.forEach((o,j)=>{if(j!==i&&o.pos===p.pos&&p.pos!==N&&p.pos!==0){o.pos=0;g.log+=` Sent ${o.n} back to start!`;}});if(p.pos===N){g.win=p.n;}}
  if(!g.win){g.turn=(i+1)%g.p.length;if(g.turn!==0)setTimeout(()=>{ludoMove(g.turn);paint('phone');},800);}}

function opsBroadcast(){const b=S.ops.bc;const fields={bus:[['route','Route'],['operator','Operator'],['all','All bus rooms']],train:[['train_no','Train number'],['all','All train rooms']],flight:[['flight_no','Flight'],['all','All flight rooms']]}[b.vertical];

function opsAudit(){return `<div class="ch"><div><h2>Audit log</h2><p>Every identity reveal and moderation action, for weekly review.</p></div></div><div class="tw"><table><thead><tr><th>When</th><th>Agent</th><th>Action</th><th>Room</th><th>Reason</th></tr></thead><tbody>${S.audit.map(a=>`<tr><td class="num">${ago(a.ts)}</td><td>${esc(a.who)}</td><td>${esc(a.what)}</td><td>${esc(S.rooms[a.room]?S.rooms[a.room].title:a.room)}</td><td>${esc(a.why)}</td></tr>`).join('')}</tbody></table></div>`;}

R.mktNav=()=>`<div class="who">Signed in · marketing.priya</div>${[['overview','Overview'],['campaigns','Campaigns'],['new','New campaign'],['guard','Ad rules']].map(p=>`<button data-act="mktPage" data-p="${p[0]}" aria-pressed="${S.mkt.page===p[0]||(p[0]==='campaigns'&&S.mkt.page==='detail')}">${p[1]}</button>`).join('')}`;
R.mktMain=()=>{const p=S.mkt.page;if(p==='overview')return mktOverview();if(p==='campaigns')return `<div class="ch"><div><h2>Campaigns</h2><p>Ads, sponsored polls and games, stop offers and research surveys across all tenants.</p></div><button class="btn pri" data-act="mktPage" data-p="new">New campaign</button></div>${campTable()}`;if(p==='detail')return `<div data-region="mktLive"></div>`;if(p==='new')return mktNew();if(p==='guard')return mktGuard();return '';};
function campTable(){return `<div class="tw"><table><thead><tr><th>Campaign</th><th>Format</th><th>Verticals</th><th>Status</th><th>Impressions</th><th>Clicks / responses</th><th></th></tr></thead><tbody>${S.campaigns.map(c=>`<tr class="click" data-act="mktOpen" data-id="${c.id}"><td><b>${esc(c.name)}</b><small>${esc(c.adv)}</small></td><td>${FMT[c.type]}</td><td>${c.v.map(v=>TEN[v].unit).join(', ')}</td><td><span class="chip ${c.status==='live'?'c-ok':c.status==='paused'?'c-mute':'c-info'}">${c.status}</span></td><td class="num">${c.st.imp.toLocaleString('en-IN')}</td><td class="num">${(c.type==='sponsored_poll'||c.type==='survey'?c.st.resp:c.st.clk).toLocaleString('en-IN')}</td><td><button class="btn sm ghost" data-act="mktToggle" data-id="${c.id}">${c.status==='live'?'Pause':'Go live'}</button></td></tr>`).join('')}</tbody></table></div>`;}
function mktOverview(){const live=S.campaigns.filter(c=>c.status==='live');const imp=S.campaigns.reduce((a,c)=>a+c.st.imp,0),clk=S.campaigns.reduce((a,c)=>a+c.st.clk,0),resp=S.campaigns.reduce((a,c)=>a+c.st.resp,0);
  const adImp=S.campaigns.filter(c=>c.type==='card'||c.type==='stop_offer').reduce((a,c)=>a+c.st.imp,0);
  return `<div class="ch"><div><h2>Marketing overview</h2><p>Sample figures for the demo, plus live counts from the prototype rooms.</p></div><span class="chip c-mute">Sample data</span></div>
  <div class="kpis"><div class="kpi"><small>Live campaigns</small><b>${live.length}</b><span>of ${S.campaigns.length}</span></div><div class="kpi"><small>Impressions</small><b>${imp.toLocaleString('en-IN')}</b><span>all formats</span></div><div class="kpi"><small>Ad click rate</small><b>${adImp?(clk*100/adImp).toFixed(1):'0'}%</b><span>cards and stop offers</span></div><div class="kpi"><small>Poll &amp; survey answers</small><b>${resp.toLocaleString('en-IN')}</b><span>sponsored and research</span></div></div>
  <div class="panel"><h3>Campaigns</h3>${campTable()}</div>
  <div class="panel"><h3>How delivery works</h3><div class="flow"><span class="s">Campaign is live</span><span class="a">→</span><span class="s">Room matches vertical, route, stage</span><span class="a">→</span><span class="s">Ad rules pass</span><span class="a">→</span><span class="s">Card appears in the room</span><span class="a">→</span><span class="s">Views, clicks, answers counted</span></div></div>`;}
R.mktLive=()=>{const c=S.campaigns.find(x=>x.id===S.mkt.sel);if(!c)return '';const ctr=c.st.imp?(c.st.clk*100/c.st.imp).toFixed(1):'0';
  let res='';const polls=[];Object.values(S.rooms).forEach(r=>r.messages.forEach(m=>{if(m.camp===c.id&&m.kind==='poll')polls.push(m);}));
  if(c.type==='sponsored_poll'){const tot={};c.poll.opts.forEach(o=>tot[o]=0);polls.forEach(m=>m.opts.forEach(o=>tot[o.t]+=o.v));const max=Math.max(1,...Object.values(tot));res=`<div class="panel"><h3>Live answers from prototype rooms</h3><div class="bars">${Object.entries(tot).map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><span class="tr"><i style="width:${v*100/max}%"></i></span><span class="num">${v}</span></div>`).join('')}</div></div>`;}
  if(c.type==='survey'){res=`<div class="panel"><h3>Survey questions</h3>${c.survey.qs.map((q,i)=>`<p class="prose">${i+1}. ${esc(q.q)} <span class="chip c-mute">${q.type}</span></p>`).join('')}</div>`;}
  return `<div class="ch"><div><button class="btn sm ghost" data-act="mktPage" data-p="campaigns">‹ Campaigns</button><h2 style="margin-top:8px">${esc(c.name)}</h2><p>${esc(c.adv)} · ${FMT[c.type]} · ${c.v.map(v=>TEN[v].name).join(', ')}${c.routes.length?' · '+c.routes.join(', '):''}${c.type==='stop_offer'&&c.stop?' · near '+c.stop:''}</p></div><div class="fil"><span class="chip ${c.status==='live'?'c-ok':'c-mute'}">${c.status}</span><button class="btn sm" data-act="mktToggle" data-id="${c.id}">${c.status==='live'?'Pause':'Go live'}</button><button class="btn sm pri" data-act="mktDeliver" data-id="${c.id}">Deliver to live rooms now</button></div></div>
  <div class="kpis"><div class="kpi"><small>Impressions</small><b>${c.st.imp.toLocaleString('en-IN')}</b></div><div class="kpi"><small>Clicks</small><b>${c.st.clk.toLocaleString('en-IN')}</b></div><div class="kpi"><small>Click rate</small><b>${ctr}%</b></div><div class="kpi"><small>Responses</small><b>${c.st.resp.toLocaleString('en-IN')}</b></div></div>
  <div class="two"><div class="stack">${res}<div class="panel"><h3>Delivery log (prototype rooms)</h3><div class="log">${c.log.slice(0,20).map(l=>`<div class="${l.ok?'ok':'no'}">${l.ok?'Delivered':'Held back'} · ${esc(S.rooms[l.room].title)} (${TEN[S.rooms[l.room].tenant].unit}) · ${esc(l.why)} · ${ago(l.ts)}</div>`).join('')||'<div>No delivery attempts yet. Rooms are checked every few seconds.</div>'}</div></div></div>
  <div class="panel"><h3>Preview</h3>${creativePreview(c)}</div></div>`;};
function creativePreview(c){const m=c.type==='sponsored_poll'?{kind:'poll',by:c.adv,q:c.poll.q,opts:c.poll.opts.map(t=>({t,v:0})),sponsored:true}:c.type==='survey'?{kind:'survey',by:c.adv,qs:c.survey.qs.length?c.survey.qs:[{type:'rating',q:'Your question'}],step:0}:c.type==='game'?{kind:'invite',game:'trivia',text:(c.cr.title||'Game')+'. '+(c.cr.body||''),camp:'x'}:{kind:'ad',cr:c.cr,adv:c.adv,stop:c.type==='stop_offer'?c.stop:null};
  const fake={tenant:c.v[0]||'bus',stops:[],members:[]};const html=msgHTML(fake,Object.assign({id:'prev',t:S.now},m)).replace(/data-act="[^"]*"/g,'');return `<div class="phone" data-tenant="${c.v[0]||'bus'}" style="height:auto;width:100%;max-width:340px;border-radius:24px"><div class="scr" style="border-radius:18px;padding:12px">${html}</div></div>`;}
function newDraft(){return {name:'',adv:'',type:'card',v:['bus'],routes:[],stop:'Kurnool',phases:['onboard'],cr:{title:'',body:'',cta:'View offer',tile:'#2b9d74'},poll:{q:'',opts:['','']},survey:{qs:[{type:'rating',q:''}]}};}
function mktNew(){const d=S.mkt.d||(S.mkt.d=newDraft());const routes=[...new Set(S.order.map(id=>S.rooms[id]).filter(r=>d.v.includes(r.tenant)).map(r=>r.route))];

  <div class="two"><div class="panel"><div class="f">
   <div class="frow"><div class="f"><label for="cn">Campaign name</label><input id="cn" data-bind="mkt.d.name" value="${esc(d.name)}"></div><div class="f"><label for="ca">Advertiser</label><input id="ca" data-bind="mkt.d.adv" value="${esc(d.adv)}"></div></div>
   <label for="cf">Format</label><select id="cf" data-bind="mkt.d.type" data-rerender="1">${Object.entries(FMT).map(([k,v])=>`<option value="${k}" ${d.type===k?'selected':''}>${v}</option>`).join('')}</select>
   <label>Verticals</label><div class="checks">${Object.keys(TEN).map(k=>`<label><input type="checkbox" data-act-change="mktV" data-k="${k}" ${d.v.includes(k)?'checked':''}> ${TEN[k].name}</label>`).join('')}</div>

   <div class="panel"><h3>Preview in a room</h3>${creativePreview(prevC)}<p class="hint" style="margin-top:10px">Always labelled. Targeting uses route, time and stop only, never chat content.</p></div></div>`;}

R.devNav=()=>`<div class="who">Developer portal</div>${[['overview','Overview'],['quick','Quickstart by vertical'],['api','API reference'],['hooks','Webhooks'],['sdk','Chat screen SDK'],['cfg','Tenants & config'],['try','Try it (sandbox)'],['errors','Errors & limits']].map(p=>`<button data-act="devPage" data-p="${p[0]}" aria-pressed="${S.dev.page===p[0]}">${p[1]}</button>`).join('')}`;
R.devMain=()=>{const p=S.dev.page;
  if(p==='overview')return `<div class="ch"><div><h2>Trip Rooms platform</h2><p>Temporary chat rooms any ixigo group app can create for a trip, fill with its travellers and embed in its app.</p></div></div>
   <div class="g3"><div class="panel"><h3>Server APIs</h3><p class="prose">Create rooms, add travellers, report trip events, push location, post alerts, run polls and campaigns, moderate.</p></div><div class="panel"><h3>Webhooks</h3><p class="prose">SOS, group issues, wait requests, reports and state changes come back to your systems.</p></div><div class="panel"><h3>Chat screen SDK</h3><p class="prose">One web component for WebViews and the web, with Android, iOS and React Native wrappers. Your colours and fonts.</p></div></div>
   <div class="panel"><h3>Plug in four steps</h3><div class="flow"><span class="s">1 · Create or get room</span><span class="a">→</span><span class="s">2 · Add traveller</span><span class="a">→</span><span class="s">3 · Get member token</span><span class="a">→</span><span class="s">4 · Open chat screen</span></div></div>
   <div class="panel"><h3>Room scope by vertical</h3><div class="tw"><table><thead><tr><th>Vertical</th><th>One room per</th><th>Opens</th><th>Location from</th><th>Special</th></tr></thead><tbody><tr><td>Bus</td><td>Service + journey date</td><td>3 hrs before first boarding</td><td>VTS GPS, else on-board travellers</td><td>Rest-stop timer, wait for me</td></tr><tr><td>Train</td><td>Coach + train run (after charting); train-wide room before</td><td>3 hrs before departure</td><td>Running status, plus travellers</td><td>Platform and coach position alerts; moves at charting</td></tr><tr><td>Flight</td><td>Flight + date</td><td>Always, or only when delayed ≥ 45 min</td><td>Flight status</td><td>Gate, boarding, belt alerts</td></tr></tbody></table></div></div>`;
  if(p==='quick'){const v=S.dev.vt;const steps={bus:[['Booking confirmed','PUT /v1/rooms/by-key/bus:{operator}:{service}:{date}'],['Add traveller','POST /v1/rooms/{id}/members'],['Bus allocated','PATCH /v1/rooms/{id} with vehicle_no; push VTS to /location/sources'],['Delay or breakdown','POST /v1/rooms/{id}/trip-events'],['User opens My Trip','POST …/members/{mid}/token → open chat screen'],['Cancelled','DELETE …/members/{mid}']],
     train:[['Booking confirmed','PUT /v1/rooms/by-key/train:{train_no}:{date} (train-wide room)'],['Add traveller','POST …/members with chart_status'],['Chart prepared','PUT coach rooms train:{no}:{date}:{coach}, then POST /v1/members:move reason=charting'],['Running status','POST /location/sources source=running_status'],['Platform change','POST /trip-events type=platform_change'],['User opens My Trip','token → chat screen']],
     flight:[['Booking confirmed','PUT /v1/rooms/by-key/flight:{carrier}{no}:{date} with activation on_delay'],['Add traveller','POST …/members (room stays dormant)'],['Delay ≥ 45 min reported','POST /location/sources flight_status or /trip-events delay → room opens, push sent'],['Gate change, boarding','POST /trip-events'],['Landed','trip-events landed, baggage_belt → read-only after 2 hrs']]}[v];
    return `<div class="ch"><div><h2>Quickstart by vertical</h2><p>The calls your backend makes, in order.</p></div><div class="vt">${Object.keys(TEN).map(k=>`<button data-act="devVt" data-v="${k}" aria-pressed="${v===k}">${TEN[k].unit}</button>`).join('')}</div></div>

  simReport:()=>{const r=room();const m=add(r,{kind:'text',who:r.members[Math.min(5,r.members.length-1)].h,text:'Call me on 98765 43210 for cheap tickets'});m.text=mask(m.text);m.reports=C(r).report_hide_at;m.hidden=true;m.orig=m.text;inbox('report',r,'Message hidden after 2 reports','“'+m.orig+'” by '+m.who,'info');S.forceBottom=true;refresh();toast('Number was masked, then 2 reports hid the message.');},
  simRest:()=>{const r=room();const i=r.stops.findIndex(s=>s.rest);if(i<0)return;const target=arr(r,i)+r.delay;while(S.now<target)advance(1);campaignTick();S.forceBottom=true;refresh();},
  simBoard:()=>{const r=room();opsPost(r,TPL.flight[2].f(r),'info');S.now=Math.max(S.now,eta(r,0)-25);refresh();},
  simDelay:()=>{const r=room();r.delay+=20;opsPost(r,TPL[r.tenant][0].f(r),'warning',{sms:true});refresh();},
  /* ops */
  opsPage:el=>{S.ops.page=el.dataset.p;S.ops.replyFor=null;paint('opsNav');paint('opsMain');},
  opsFilter:el=>{S.ops.filter=el.dataset.f;paint('opsMain');},
  opsOpen:el=>{S.ops.room=el.dataset.id;S.ops.page='room';S.ops.tpl='';S.ops.draft='';S.tmp={};const r=S.rooms[el.dataset.id];if(r.scenario)S.tenant=r.tenant;refresh();},
  opsSend:()=>{const r=S.rooms[S.ops.room],t=S.ops.draft.trim();if(!t)return toast('Write the alert first.');opsPost(r,t,S.ops.sev,{push:S.ops.push,sms:S.ops.sms});S.ops.draft='';S.ops.tpl='';toast('Posted and pinned in '+r.title+'.');refresh();},
  opsDelay:el=>{const r=S.rooms[S.ops.room],n=+el.dataset.n;if(n===0){r.delay=0;r.breakdown=false;toast('Delay cleared.');}else{r.delay+=n;opsPost(r,TPL[r.tenant][0].f(r),'warning',{sms:true});}emit('trip_event.delay',r,'delay now '+r.delay+' min');refresh();},
  opsPlatform:()=>{const r=S.rooms[S.ops.room];r.meta.platform=S.tmp.plat||r.meta.platform;opsPost(r,TPL.train[1].f(r),'warning');refresh();},
  opsGate:()=>{const r=S.rooms[S.ops.room];r.meta.gate=S.tmp.gate||r.meta.gate;opsPost(r,TPL.flight[1].f(r),'warning');refresh();},
  opsBoarding:()=>{const r=S.rooms[S.ops.room];opsPost(r,TPL.flight[2].f(r),'info');refresh();},
  opsTimer:()=>{const r=S.rooms[S.ops.room];add(r,{kind:'timer',stop:r.stops[Math.min(lastIdx(r),Math.round(r.pos))].n,leaveAt:S.now+20});emit('trip_event.rest_stop_started',r,'20-min stop');S.forceBottom=true;refresh();},
  opsVoucher:el=>{const r=S.rooms[S.ops.room];add(r,{kind:'voucher',amount:+el.dataset.n});emit('voucher.issued',r,'₹'+el.dataset.n+' to '+r.members.length+' travellers');S.forceBottom=true;toast('Voucher dropped in the room.');refresh();},
  opsOnly:()=>{const r=S.rooms[S.ops.room];r.opsOnly=!r.opsOnly;S.audit.unshift({ts:Date.now(),who:'ops.ravi',what:'Ops-only mode '+(r.opsOnly?'on':'off'),room:r.id,why:'Moderation'});emit('room.moderation',r,'ops_only '+r.opsOnly);refresh();},
  opsSlow:()=>{const r=S.rooms[S.ops.room];r.slow=!r.slow;emit('room.moderation',r,'slow_mode '+r.slow);refresh();},
  crewPost:()=>{const r=S.rooms[S.ops.room];add(r,{kind:'crew',text:r.tenant==='bus'?'Bus will wait 5 min at '+r.stops[nextIdx(r)].n+'. Please be ready at the pickup point.':r.tenant==='train'?'Bedrolls are being handed out now.':'Cabin crew: boarding pass and ID ready, please.'});S.forceBottom=true;refresh();},
  opsMute:el=>{const r=S.rooms[S.ops.room],m=r.members.find(x=>x.h===el.dataset.h);m.muted=!m.muted;S.audit.unshift({ts:Date.now(),who:'ops.ravi',what:(m.muted?'Muted ':'Unmuted ')+m.h,room:r.id,why:'Moderation'});refresh();},
  opsReveal:el=>{const r=S.rooms[S.ops.room],h=el.dataset.h;const key=r.id+'|'+h;if(S.ops.reveal[key]){delete S.ops.reveal[key];refresh();return;}
    S.ops.reveal[key]={ref:(r.tenant==='bus'?'ABX':r.tenant==='train'?'PNR ':'')+Math.random().toString(36).slice(2,8).toUpperCase(),name:'R*** K***',phone:'+91 9•••• ••'+Math.floor(10+Math.random()*89),why:S.ops.revealReason};
    S.audit.unshift({ts:Date.now(),who:'ops.ravi',what:'Revealed booking behind “'+h+'”',room:r.id,why:S.ops.revealReason});emit('member.revealed',r,h+' · '+S.ops.revealReason);refresh();},
  call:()=>toast('Calling through a masked line. The traveller sees an ixigo support number.'),
  opsRemove:el=>{const r=S.rooms[S.ops.room];r.messages=r.messages.filter(m=>m.id!==el.dataset.id);S.audit.unshift({ts:Date.now(),who:'ops.ravi',what:'Removed a message',room:r.id,why:'Moderation'});refresh();},
  opsRestore:el=>{const r=S.rooms[S.ops.room],m=r.messages.find(x=>x.id===el.dataset.id);m.hidden=false;m.text=m.orig||m.text;refresh();},
  ibAck:el=>{const i=S.inbox.find(x=>x.id===el.dataset.id);i.status='ack';emit('action.updated',S.rooms[i.room],'acknowledged');refresh();},
  ibResolve:el=>{const i=S.inbox.find(x=>x.id===el.dataset.id);i.status='resolved';emit('action.updated',S.rooms[i.room],'resolved');refresh();},
  ibReply:el=>{S.ops.replyFor=S.ops.replyFor===el.dataset.id?null:el.dataset.id;refresh();},
  ibReplySend:el=>{const i=S.inbox.find(x=>x.id===el.dataset.id);const r=S.rooms[i.room];privateMsg(r,el.dataset.t);if(i.status==='open')i.status='ack';S.ops.replyFor=null;emit('action.updated',r,'private reply sent');toast('Reply sent privately.');refresh();},
  bcSend:()=>{const b=S.ops.bc;if(!b.text.trim())return toast('Write the message first.');const m=bcMatch();m.forEach(r=>opsPost(r,b.text.trim(),b.sev,{push:b.push,sms:b.sms}));toast('Sent to '+m.length+' rooms.');b.text='';refresh();},
  /* marketing */
  mktPage:el=>{S.mkt.page=el.dataset.p;paint('mktNav');paint('mktMain');},
  mktOpen:(el,e)=>{if(e.target.closest('[data-act="mktToggle"]'))return;S.mkt.sel=el.dataset.id;S.mkt.page='detail';paint('mktNav');paint('mktMain');},
  mktToggle:el=>{const c=S.campaigns.find(x=>x.id===el.dataset.id);c.status=c.status==='live'?'paused':'live';toast(c.name+' is '+c.status+'.');refresh();},
  mktDeliver:el=>{const c=S.campaigns.find(x=>x.id===el.dataset.id);let n=0;Object.values(S.scenario).forEach(id=>{if(deliver(S.rooms[id],c,false))n++;});toast(n?'Delivered to '+n+' live room'+(n>1?'s':'')+'.':'Held back by targeting or ad rules. See the delivery log.');refresh();},
  mktAddOpt:()=>{S.mkt.d.poll.opts.push('');paint('mktMain');},
  mktAddQ:()=>{S.mkt.d.survey.qs.push({type:'rating',q:''});paint('mktMain');},
  mktReset:()=>{S.mkt.d=newDraft();paint('mktMain');},
  mktLaunch:()=>{const d=S.mkt.d;if(!d.name.trim()||!d.adv.trim())return toast('Add a campaign name and advertiser.');if(!d.v.length)return toast('Pick at least one vertical.');
    if((d.type==='card'||d.type==='stop_offer')&&!d.cr.title.trim())return toast('Add a title for the card.');if(d.type==='sponsored_poll'&&(!d.poll.q.trim()||d.poll.opts.filter(o=>o.trim()).length<2))return toast('Add a question and at least 2 options.');
    if(d.type==='survey'&&!d.survey.qs.some(q=>q.q.trim()))return toast('Add at least one question.');
    const c={id:uid('c'),name:d.name.trim(),adv:d.adv.trim(),type:d.type,v:[...d.v],routes:[...d.routes],stop:d.stop,phases:[...d.phases],status:'live',cr:Object.assign({},d.cr),poll:{q:d.poll.q,opts:d.poll.opts.filter(o=>o.trim())},survey:{qs:d.survey.qs.filter(q=>q.q.trim()).map(q=>q.type==='choice'?{type:'choice',q:q.q,opts:['Yes','No','Not sure']}:q)},st:{imp:0,clk:0,resp:0},log:[],del:{}};
    S.campaigns.unshift(c);let n=0;Object.values(S.scenario).forEach(id=>{if(deliver(S.rooms[id],c))n++;});S.mkt.d=newDraft();S.mkt.sel=c.id;S.mkt.page='detail';toast(n?'Live. Delivered to '+n+' room'+(n>1?'s':'')+' now.':'Live. Rooms will get it when targeting and ad rules allow.');refresh();},
  goDevCfg:()=>{S.view='dev';S.dev.page='cfg';renderView();},
  /* dev */
  devPage:el=>{S.dev.page=el.dataset.p;paint('devNav');paint('devMain');},
  devEp:el=>{S.dev.ep=el.dataset.id;paint('devMain');},
  devVt:el=>{S.dev.vt=el.dataset.v;paint('devMain');},
  devCt:el=>{S.dev.ct=el.dataset.v;paint('devMain');},
  cfgT:el=>{const c=S.config[S.dev.ct];c.features[el.dataset.k]=!c.features[el.dataset.k];emit('tenant.config_updated',null,TEN[S.dev.ct].name+': '+FEATURE_LABELS[el.dataset.k]+' '+(c.features[el.dataset.k]?'on':'off'));refresh();},
  rotate:()=>toast('New secret issued. The old one works for 24 hours.'),
  trySend:()=>{const res=mockApi(S.dev.tryEp,S.dev.tryBody);S.dev.tryRes=res;S.forceBottom=true;refresh();},
  tryReset:()=>{S.dev.tryBody=tryExample(S.dev.tryEp);S.dev.tryRes=null;paint('devMain');}
};
function checkEsc(r,m){const th=C(r).issue_escalate_at;if(!m.escalated&&m.count>=th){m.escalated=true;inbox('issue',r,m.label,m.count+' travellers reported this. Auto-escalated.','warning',true);toast('Escalated to '+TEN[r.tenant].ops+'.');}}
function tryUC(u){const r=room(),c=C(r);
  const map={quick:()=>send(QUICK[r.tenant][0]),
    alerts:()=>{opsPost(r,TPL[r.tenant][r.tenant==='flight'?3:0].f(r),'warning',{sms:true});toast('Posted as Ops. Try it yourself in the Ops console.');},
    games:()=>{S.sheet={t:'game-list'};}, ads:()=>{const cands=S.campaigns.filter(x=>x.status==='live'&&x.v.includes(r.tenant)&&(x.type==='card'||x.type==='stop_offer'||x.type==='sponsored_poll'));if(!cands.length)return toast('No live ad campaign for this tenant. Create one in Marketing.');let ok=false;for(const x of cands){if(deliver(r,x,false)){ok=true;break;}}if(!ok){const x=cands[0];toast('Held back: '+adCheck(r,x).why+'. That’s the ad rules working.');}},
    polls:()=>{add(r,{kind:'poll',by:TEN[r.tenant].name,q:r.tenant==='flight'?'Would you like a meal voucher or lounge access?':'Is the AC temperature okay?',opts:r.tenant==='flight'?[{t:'Meal voucher',v:9},{t:'Lounge access',v:5}]:[{t:'Too cold',v:4},{t:'Just right',v:7},{t:'Too warm',v:1}]});emit('poll.created',r,'Trip poll');S.forceBottom=true;},
    survey:()=>{add(r,{kind:'survey',camp:'c3',by:'AbhiBus Research',qs:S.campaigns.find(x=>x.id==='c3').survey.qs,step:0,ans:[]});S.forceBottom=true;},
    track:()=>{S.sheet={t:'map'};}, rest:()=>A.simRest(), issue:()=>{S.sheet={t:'issue'};}, sos:()=>{S.sheet={t:'sos'};},
    wait:()=>{if(r.phase!=='open')return toast('Wait for me works before boarding. Set Room stage to “Open (waiting)”.');S.sheet={t:'wait'};},
    catch:()=>{add(r,{kind:'tara',text:taraCatchUp(r)});S.forceBottom=true;}, tara:()=>{S.lastSend=0;send('@Tara '+(r.tenant==='flight'?'when do we depart?':'how far are we from the next stop?'));},
    voucher:()=>{add(r,{kind:'voucher',amount:100});S.forceBottom=true;}, lost:()=>{if(r.phase!=='readonly')toast('Lost & found also opens from + while the room is live.');S.sheet={t:'lost'};},
    social:()=>{r.members=r.members.slice(0,2);toast('Room now has 2 travellers. Group chat is hidden; Tara answers instead.');},
    translate:()=>{S.lang=S.lang==='en'?'hi':'en';toast(S.lang==='hi'?'Reading in Hindi. Seeded messages are translated in this demo.':'Back to English.');},
    cab:()=>{add(r,{kind:'p2',sub:'cab',title:'Cab from '+r.stops[r.drop].n,body:'Partner cab, pre-filled pickup at your drop point. Fixed fare shown before booking.',cta:'Book cab'});S.forceBottom=true;},
    food:()=>{S.sheet={t:'food'};}, cross:()=>{add(r,{kind:'p2',sub:'return',title:r.tenant==='flight'?'Need a cab or hotel in Bengaluru?':'Book your return trip',body:'Offers from ixigo for your destination.',cta:'See options'});S.forceBottom=true;},
    crew:()=>{add(r,{kind:'crew',text:r.tenant==='bus'?'Bus will wait 5 min at '+r.stops[nextIdx(r)].n+'. Please be ready at the pickup point.':r.tenant==='train'?'Bedrolls are being handed out now.':'Cabin crew: boarding pass and ID ready, please.'});S.forceBottom=true;}};
  if(!['quick','tara'].includes(u)){if(map[u])map[u]();refresh();}else map[u]();}

/* ---------- events wiring ---------- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const fn=A[el.dataset.act];if(!fn)return;if(el.tagName==='BUTTON')e.preventDefault();fn(el,e);});
document.addEventListener('submit',e=>{const f=e.target;if(f.dataset.submit==='send'){e.preventDefault();const inp=f.querySelector('#composer');send(inp?inp.value:S.draft);}});
function setPath(path,val){const ks=path.split('.');let o=path.startsWith('sheet.')?S:S;if(ks[0]==='sheet'){if(!S.sheet)return;o=S.sheet;ks.shift();}else if(ks[0]==='tmp'){o=S.tmp;ks.shift();}
  for(let i=0;i<ks.length-1;i++){o=o[ks[i]];if(o==null)return;}o[ks[ks.length-1]]=val;}
document.addEventListener('input',e=>{const t=e.target;if(t.id==='composer'){S.draft=t.value;return;}if(t.dataset.bind&&t.type!=='checkbox'&&t.tagName!=='SELECT'){setPath(t.dataset.bind,t.dataset.num?Math.max(0,+t.value||0):t.value);if(t.closest('[data-region="mktMain"]')&&S.mkt.page==='new'){clearTimeout(setPath._t);setPath._t=setTimeout(()=>{if(S.view!=='mkt'||S.mkt.page!=='new')return;const p=document.querySelector('[data-region="mktMain"] .panel:last-child');if(p)p.innerHTML='<h3>Preview in a room</h3>'+creativePreview(previewDraft())+'<p class="hint" style="margin-top:10px">Always labelled. Targeting uses route, time and stop only, never chat content.</p>';},250);}}});
function previewDraft(){const d=S.mkt.d;return Object.assign({},d,{adv:d.adv||'Advertiser',cr:Object.assign({},d.cr,{title:d.cr.title||'Your title',body:d.cr.body||'Your one-line message'}),poll:{q:d.poll.q||'Your question',opts:d.poll.opts.map((o,i)=>o||'Option '+(i+1))},survey:{qs:d.survey.qs.map(q=>Object.assign({},q,{q:q.q||'Your question',opts:['Yes','No','Not sure']}))}});}
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.bind&&(t.type==='checkbox'||t.tagName==='SELECT'||t.type==='color'||t.type==='time'||t.type==='number')){setPath(t.dataset.bind,t.type==='checkbox'?t.checked:(t.dataset.num?Math.max(0,+t.value||0):t.value));
    if(t.dataset.rerender)refresh();if(t.dataset.bind.startsWith('config.'))paintTick();if(t.type==='color')refresh();return;}
  const a=t.dataset.actChange;if(!a)return;
  if(a==='opsTpl'){S.ops.tpl=t.value;const r=S.rooms[S.ops.room];const tp=TPL[r.tenant].find(x=>x.id===t.value);if(tp)S.ops.draft=tp.f(r);S.ops.sev=t.value==='breakdown'?'critical':(t.value==='boarding'||t.value==='pantry'||t.value==='meal'||t.value==='belt'||t.value==='fixed')?'info':'warning';refresh();}
  if(a==='mktV'){const d=S.mkt.d,k=t.dataset.k;d.v=t.checked?[...new Set([...d.v,k])]:d.v.filter(x=>x!==k);d.routes=[];refresh();}
  if(a==='mktR'){const d=S.mkt.d,k=t.dataset.k;d.routes=t.checked?[...new Set([...d.routes,k])]:d.routes.filter(x=>x!==k);}
  if(a==='mktP'){const d=S.mkt.d,k=t.dataset.k;d.phases=t.checked?[...new Set([...d.phases,k])]:d.phases.filter(x=>x!==k);}
  if(a==='tryEp'){S.dev.tryEp=t.value;S.dev.tryBody=tryExample(t.value);S.dev.tryRes=null;paint('devMain');}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(S.sheet||S.menu)){S.sheet=null;S.menu=false;S.game=null;refresh();}});

/* ---------- ambient: spotlight + neural mesh ---------- */
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
(function(){const rv=document.getElementById('reveal');if(!rv||reduce)return;let tx=.5,ty=.3,sx=.5,sy=.3,user=false;const t0=performance.now();
  addEventListener('pointermove',e=>{tx=e.clientX/innerWidth;ty=e.clientY/innerHeight;user=true;});document.addEventListener('pointerleave',()=>{user=false;});
  (function loop(t){if(!user){const a=(t-t0)/5000;tx=.5+.3*Math.cos(a);ty=.4+.25*Math.sin(a*1.3);}sx+=(tx-sx)*.1;sy+=(ty-sy)*.1;rv.style.setProperty('--mx',(sx*100).toFixed(2)+'%');rv.style.setProperty('--my',(sy*100).toFixed(2)+'%');requestAnimationFrame(loop);})(t0);})();
(function(){const c=document.getElementById('mesh');if(!c||reduce)return;const x=c.getContext('2d');let W,H,N=[],mx=-999,my=-999;
  function size(){const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);const n=Math.round(Math.min(60,W*H/26000));N=[];for(let i=0;i<n;i++)N.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.22,vy:(Math.random()-.5)*.22,a:Math.random()<.3});}
  size();addEventListener('resize',size);addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;});
  (function draw(){x.clearRect(0,0,W,H);for(let i=0;i<N.length;i++){const p=N[i];p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
    for(let j=i+1;j<N.length;j++){const q=N[j],dx=p.x-q.x,dy=p.y-q.y,d=dx*dx+dy*dy;if(d<16000){x.strokeStyle='rgba(62,214,192,'+(.14*(1-d/16000))+')';x.lineWidth=1;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke();}}
    const dm=(p.x-mx)**2+(p.y-my)**2;if(dm<26000){x.strokeStyle='rgba(255,181,71,'+(.3*(1-dm/26000))+')';x.beginPath();x.moveTo(p.x,p.y);x.lineTo(mx,my);x.stroke();}
    x.fillStyle=p.a?'rgba(255,181,71,.65)':'rgba(62,214,192,.5)';x.beginPath();x.arc(p.x,p.y,p.a?1.8:1.3,0,6.283);x.fill();}requestAnimationFrame(draw);})();})();

/* ---------- boot ---------- */
seed();renderView();setInterval(tick,3000);
window.__S=S;
})();
